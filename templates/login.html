<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Android Admin</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><main class="login-card"><div class="brand"><span class="brand-mark">A</span><div><strong>Android Admin</strong><small>Authorized Device Management</small></div></div><h1>Aceder ao painel</h1>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}<form method="post" action="/login"><label>Utilizador<input name="username" value="admin" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button></form><p class="muted">Protótipo. Altere as credenciais iniciais antes de produção.</p></main></body></html>
